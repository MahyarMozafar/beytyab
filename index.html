<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بیت‌یاب — شعری برای حالِ دلت</title>
<meta name="description" content="حالِ دلت را بنویس؛ بیت‌یاب بیت‌هایی از حافظ، سعدی و مولانا را پیدا می‌کند که همان معنا را دارند. همه‌چیز روی دستگاه خودت اجرا می‌شود.">
<meta name="theme-color" content="#efe4cb">
<meta property="og:title" content="بیت‌یاب — شعری برای حالِ دلت">
<meta property="og:description" content="جست‌وجوی معنایی در شعر حافظ، سعدی و مولانا">
<meta property="og:type" content="website">
<meta property="og:locale" content="fa_IR">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="بیت‌یاب">
<link rel="preload" href="fonts/Vazirmatn-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/NotoNastaliqUrdu-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- Drawings used in several places -->
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3c46c"/>
      <stop offset=".5" stop-color="#c0902f"/>
      <stop offset="1" stop-color="#dcb95a"/>
    </linearGradient>

    <!-- one leaf, tip to the right -->
    <path id="leaf" d="M0 0C6-7 17-7 24 0C17 7 6 7 0 0Z"/>
    <!-- five-petal flower -->
    <g id="flower">
      <g fill="#d98c76" stroke="#a8442f" stroke-width=".8">
        <ellipse cx="0" cy="-8" rx="5" ry="7.5"/>
        <ellipse cx="0" cy="-8" rx="5" ry="7.5" transform="rotate(72)"/>
        <ellipse cx="0" cy="-8" rx="5" ry="7.5" transform="rotate(144)"/>
        <ellipse cx="0" cy="-8" rx="5" ry="7.5" transform="rotate(216)"/>
        <ellipse cx="0" cy="-8" rx="5" ry="7.5" transform="rotate(288)"/>
      </g>
      <circle r="3.6" fill="#d9b65a" stroke="#9a7420" stroke-width=".8"/>
    </g>
    <!-- closed bud -->
    <g id="bud">
      <path d="M0 0C-5-6-4-14 0-18C4-14 5-6 0 0Z" fill="#d98c76" stroke="#a8442f" stroke-width=".8"/>
      <path d="M-4-2C-2-6 2-6 4-2C2 1-2 1-4-2Z" fill="#6f8a4e" stroke="#4d6535" stroke-width=".6"/>
    </g>

    <!-- flower-and-bird corner (gol-o-morgh), grows from the bottom-left -->
    <symbol id="corner" viewBox="0 0 200 200">
      <g fill="none" stroke="#7a5a2a" stroke-width="1.6" stroke-linecap="round">
        <path d="M6 196C26 150 52 104 104 72S166 30 194 8"/>
        <path d="M58 118C78 126 98 124 116 112"/>
        <path d="M98 76C92 56 98 38 114 26"/>
        <path d="M146 44C158 52 172 52 184 44"/>
        <path d="M30 156C22 140 22 124 30 110"/>
      </g>
      <g fill="#8aa262" stroke="#4d6535" stroke-width=".8">
        <use href="#leaf" transform="translate(22 170) rotate(-25)"/>
        <use href="#leaf" transform="translate(40 140) rotate(-150)"/>
        <use href="#leaf" transform="translate(66 106) rotate(-40)"/>
        <use href="#leaf" transform="translate(84 122) rotate(20)"/>
        <use href="#leaf" transform="translate(100 60) rotate(-120)"/>
        <use href="#leaf" transform="translate(128 58) rotate(-20)"/>
        <use href="#leaf" transform="translate(160 50) rotate(15)"/>
        <use href="#leaf" transform="translate(164 30) rotate(-140)"/>
        <use href="#leaf" transform="translate(28 128) rotate(-75)"/>
      </g>
      <use href="#flower" transform="translate(118 110) scale(1.15)"/>
      <use href="#flower" transform="translate(116 24) scale(.95)"/>
      <use href="#flower" transform="translate(30 106) scale(.85)"/>
      <use href="#bud" transform="translate(186 43) rotate(70)"/>
      <use href="#bud" transform="translate(194 8) rotate(40) scale(.9)"/>
      <!-- bird sitting on the branch -->
      <g transform="translate(60 84) rotate(-18)">
        <path d="M14 4C22-8 40-8 48 2C56 8 70 8 82 18C68 18 58 18 48 15C38 22 20 18 14 4Z" fill="#2c5296" stroke="#17305f" stroke-width="1"/>
        <path d="M30 4C38 0 46 4 50 10C42 12 34 10 30 4Z" fill="#5f86c4" stroke="#17305f" stroke-width=".7"/>
        <circle cx="12" cy="-2" r="7.5" fill="#2c5296" stroke="#17305f" stroke-width="1"/>
        <path d="M5-3L-4-1L5 1Z" fill="#c0902f" stroke="#7a5a2a" stroke-width=".6"/>
        <circle cx="10" cy="-4" r="1.5" fill="#f6ecd2"/>
        <path d="M24 9C22 2 14 4 12 5" fill="none" stroke="#d9b65a" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M32 17L31 25M38 17L38 25" stroke="#7a5a2a" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </symbol>

    <!-- medallion (toranj) for the cover -->
    <symbol id="toranj" viewBox="0 0 220 340">
      <path d="M110 4L118 22L110 40L102 22Z" fill="url(#g-gold)" stroke="#8a6420" stroke-width="1"/>
      <path d="M110 300L118 318L110 336L102 318Z" fill="url(#g-gold)" stroke="#8a6420" stroke-width="1"/>
      <path d="M110 44C122 62 138 66 150 82C166 86 176 100 180 116C194 130 198 150 194 170C198 190 194 210 180 224C176 240 166 254 150 258C138 274 122 278 110 296C98 278 82 274 70 258C54 254 44 240 40 224C26 210 22 190 26 170C22 150 26 130 40 116C44 100 54 86 70 82C82 66 98 62 110 44Z" fill="url(#g-gold)" stroke="#8a6420" stroke-width="1.5"/>
      <path d="M110 62C120 76 134 80 144 94C158 98 166 110 169 124C180 136 183 153 180 170C183 187 180 204 169 216C166 230 158 242 144 246C134 260 120 264 110 278C100 264 86 260 76 246C62 242 54 230 51 216C40 204 37 187 40 170C37 153 40 136 51 124C54 110 62 98 76 94C86 80 100 76 110 62Z" fill="none" stroke="#7a5418" stroke-width="1.2" opacity=".75"/>
      <g fill="none" stroke="#7a5418" stroke-width="1" opacity=".55" stroke-linecap="round">
        <path d="M110 76C102 88 102 96 110 104C118 96 118 88 110 76Z"/>
        <path d="M110 264C102 252 102 244 110 236C118 244 118 252 110 264Z"/>
        <path d="M70 120C62 114 54 118 54 126C54 134 64 136 68 130"/>
        <path d="M150 120C158 114 166 118 166 126C166 134 156 136 152 130"/>
        <path d="M70 220C62 226 54 222 54 214C54 206 64 204 68 210"/>
        <path d="M150 220C158 226 166 222 166 214C166 206 156 204 152 210"/>
      </g>
    </symbol>

    <!-- corner piece (lachak) for the cover -->
    <symbol id="lachak" viewBox="0 0 120 120">
      <path d="M2 2H112C104 30 86 44 64 48C58 58 60 70 50 78C44 96 26 108 2 112Z" fill="url(#g-gold)" stroke="#8a6420" stroke-width="1.4"/>
      <path d="M12 12H94C86 30 72 38 56 40C50 50 52 60 42 68C36 82 26 92 12 96Z" fill="none" stroke="#7a5418" stroke-width="1" opacity=".7"/>
      <path d="M22 22C38 22 46 30 40 40C34 48 24 44 26 36M22 22C22 38 30 46 40 40" fill="none" stroke="#7a5418" stroke-width="1" opacity=".55" stroke-linecap="round"/>
    </symbol>

    <!-- small icons -->
    <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M17 9l4 6M21 9l-4 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-sound-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21V3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-mark-on" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21V3Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M5 12v8h14v-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5M6.5 10v10h11V10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M14.5 5 8 12l6.5 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M9.5 5 16 12l-6.5 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.2 4.2 0 0 0 6 0l3.2-3.2a4.2 4.2 0 0 0-6-6L12 6M14 10a4.2 4.2 0 0 0-6 0l-3.2 3.2a4.2 4.2 0 0 0 6 6L12 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.8" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.6-4.6-2-8-2v14c3.4 0 6 .4 8 2 2-1.6 4.6-2 8-2V4c-3.4 0-6 .4-8 2Zm0 0v14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<main class="desk">
  <nav class="tools" aria-label="ابزارها">
    <button class="tool" id="tool-home" type="button" aria-label="صفحهٔ نخست" title="صفحهٔ نخست"><svg><use href="#i-home"/></svg></button>
    <button class="tool" id="tool-marks" type="button" aria-label="بیت‌های نشان‌شده" title="نشان‌شده‌ها"><svg><use href="#i-mark"/></svg></button>
    <button class="tool" id="tool-about" type="button" aria-label="این کتاب چطور کار می‌کند؟" title="دربارهٔ کتاب"><svg><use href="#i-info"/></svg></button>
    <button class="tool" id="tool-sound" type="button" aria-label="صدای ورق زدن" aria-pressed="false" title="صدا"><svg><use href="#i-sound-off"/></svg></button>
  </nav>
  <div class="book" id="book" data-state="closed" data-view="search">

    <!-- The open book: two pages, right and left -->
    <div class="spread" id="spread" aria-hidden="true">
      <!-- the leather boards under the pages -->
      <div class="boards" aria-hidden="true"></div>
      <article class="page page--main" id="page-main" aria-live="polite">
        <div class="page__frame" aria-hidden="true"></div>
        <svg class="page__corner page__corner--a" aria-hidden="true"><use href="#corner"/></svg>
        <svg class="page__corner page__corner--b" aria-hidden="true"><use href="#corner"/></svg>
        <div class="page__body" id="main-body"></div>
      </article>
      <article class="page page--side" id="page-side">
        <div class="page__frame" aria-hidden="true"></div>
        <svg class="page__corner page__corner--a" aria-hidden="true"><use href="#corner"/></svg>
        <svg class="page__corner page__corner--b" aria-hidden="true"><use href="#corner"/></svg>
        <div class="page__body" id="side-body"></div>
      </article>
      <div class="spine" aria-hidden="true"></div>
    </div>

    <!-- The closed cover: first thing a visitor sees -->
    <section class="cover" id="cover">
      <div class="cover__face cover__face--front">
        <div class="cover__frame" aria-hidden="true"></div>
        <svg class="cover__lachak cover__lachak--1" aria-hidden="true"><use href="#lachak"/></svg>
        <svg class="cover__lachak cover__lachak--2" aria-hidden="true"><use href="#lachak"/></svg>
        <svg class="cover__lachak cover__lachak--3" aria-hidden="true"><use href="#lachak"/></svg>
        <svg class="cover__lachak cover__lachak--4" aria-hidden="true"><use href="#lachak"/></svg>

        <div class="cover__center">
          <div class="medallion">
            <svg class="medallion__shape" aria-hidden="true"><use href="#toranj"/></svg>
            <h1 class="medallion__title">بیت‌یاب</h1>
          </div>
          <p class="cover__tagline">شعری برای حالِ دلت</p>
          <p class="cover__poets">حافظ · سعدی · مولانا</p>
        </div>

        <div class="cover__foot">
          <p class="cover__gift" id="cover-gift" hidden>یک بیت برای تو فرستاده‌اند</p>
          <button class="open-btn" id="open-btn" type="button">کتاب را باز کن</button>
          <p class="cover__load" id="cover-load" role="status">در حال آماده‌سازی…</p>
        </div>

        <div class="cover__trace" id="trace" aria-hidden="true"></div>
      </div>
      <div class="cover__face cover__face--back" aria-hidden="true"></div>
      <div class="cover__edge cover__edge--fore" aria-hidden="true"></div>
      <div class="cover__edge cover__edge--foot" aria-hidden="true"></div>
    </section>
  </div>

  <p class="credit">متن شعرها و معنی‌ها از <a href="https://ganjoor.net" target="_blank" rel="noopener">گنجور</a> · معنی‌های ساده را ماشین نوشته و شاید دقیق نباشند · جست‌وجو روی دستگاه خودت انجام می‌شود</p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p class="noscript">برای استفاده از بیت‌یاب باید جاوااسکریپت مرورگر روشن باشد.</p></noscript>

<script src="js/vendor/gsap.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
